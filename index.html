<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Cash</title>
<meta name="description" content="لعبة ويب ثلاثية الأبعاد: اجمع الفلوس في المدينة واهرب من الشرطة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0d10;--ink:#f5f2ea;--muted:#b9b4a8;--accent:#7be07a;--gold:#ffd166;--danger:#ff4d5e;--panel:rgba(12,14,18,.74);--line:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0d10}}
:root[data-theme="dark"]{--bg:#0b0d10}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#game{display:block;position:fixed;inset:0;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 14px 8px 10px;border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.face{width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center 28%;border:2px solid var(--accent);flex:none;background-color:#222}
.name{font-weight:800;font-size:16px;line-height:1.1}
.hearts{font-size:15px;letter-spacing:2px;margin-top:2px;direction:ltr;text-align:right}
.stam{width:110px;height:6px;border-radius:4px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#57c7ff,#7be07a);border-radius:4px;transition:background .2s}
.stam.tired i{background:#ff8a3d}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.money{font-weight:900;font-size:26px;color:var(--gold);line-height:1;direction:ltr;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.count{font-size:13px;color:var(--muted);direction:ltr;text-align:left}
#radar{width:150px;height:150px;border-radius:14px;border:1px solid var(--line);background:#14171b;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btns{display:flex;gap:6px;pointer-events:auto}
.btns button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px}
.banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;font-weight:800;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .25s}
.banner.show{opacity:1}
.banner.police{background:rgba(160,16,32,.85);animation:pulse 0.9s infinite}
.banner.ok{background:rgba(30,120,60,.85)}
.banner.info{background:var(--panel)}
@keyframes pulse{50%{background:rgba(20,40,170,.85)}}
#flash{position:fixed;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,30,.45));opacity:0;pointer-events:none;transition:opacity .15s}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);transform:translate(-50%,-50%);display:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.55)}
#runBtn{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(123,224,122,.25);color:#fff;font-weight:800;font-size:18px;pointer-events:auto;display:none}
#runBtn.on{background:rgba(123,224,122,.55)}
body.touch #runBtn{display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(10,12,16,.55),rgba(5,6,8,.88));z-index:5;overflow:auto}
.panel{display:flex;gap:26px;align-items:center;max-width:820px;width:100%;background:rgba(16,18,23,.9);border:1px solid var(--line);border-radius:24px;padding:24px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel img{height:min(56vh,430px);width:auto;flex:none;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}
.panel h1{margin:0 0 6px;font-size:44px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,var(--gold),#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel p{margin:0 0 14px;color:var(--muted);font-size:16px;line-height:1.7}
.panel label{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px}
.panel input{font-family:inherit;font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0d0f13;color:var(--ink);width:170px}
.keys{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px}
.keys li{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:14px;color:var(--muted)}
.keys b{color:var(--ink);margin-left:4px}
body.touch .keys.desktop,body:not(.touch) .keys.touch{display:none}
.primary{font-size:20px;font-weight:900;padding:12px 34px;border-radius:14px;border:0;background:linear-gradient(180deg,#8ff08e,#4fbf4e);color:#0b1a0b;box-shadow:0 8px 0 #2d7f2c,0 14px 24px rgba(0,0,0,.4);transition:transform .08s}
.primary:active{transform:translateY(4px);box-shadow:0 4px 0 #2d7f2c}
.primary:disabled{filter:grayscale(1);opacity:.6}
.panel.small{flex-direction:column;text-align:center;max-width:420px;gap:10px}
.face.big{width:120px;height:120px;border-width:3px}
.panel h2{margin:4px 0 0;font-size:32px;font-weight:900}
.best{color:var(--gold);font-weight:700}
@media (max-width:640px){
  .panel{flex-direction:column;padding:18px;gap:10px;text-align:center}
  .panel img{height:30vh}
  .panel h1{font-size:34px}
  .panel label{justify-content:center}
  .keys{justify-content:center}
  #radar{width:104px;height:104px}
  .money{font-size:21px}
  .face{width:44px;height:44px}
  .stam{width:80px}
  .banner{top:auto;bottom:140px;font-size:15px}
  .card{padding:6px 10px 6px 8px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="hud" hidden>
  <div class="top">
    <div class="card">
      <div class="face" data-face></div>
      <div>
        <div class="name" id="hudName">البطل</div>
        <div class="hearts" id="hearts">❤️❤️❤️</div>
        <div class="stam" id="stamWrap"><i id="stam"></i></div>
      </div>
    </div>
    <div class="side">
      <div class="card"><div><div class="money" id="money">$0</div><div class="count" id="count">0 / 15</div></div></div>
      <canvas id="radar" width="150" height="150"></canvas>
      <div class="btns"><button id="muteBtn" aria-label="الصوت">🔊</button><button id="zoomBtn" aria-label="تقريب الكاميرا">🔍</button></div>
    </div>
  </div>
  <div id="banner" class="banner"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="runBtn">جري</button>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <img id="heroImg" alt="البطل">
    <div>
      <h1>فلوس الشارع</h1>
      <p>اجمع ١٥ رزمة فلوس متوزعة في المدينة. أول ما تاخد أول رزمة، الشرطة هتطلع وراك. اجري واستخبى ورا المباني، وخلي بالك من العربيات في الشارع.</p>
      <label>اسم البطل <input id="nameIn" maxlength="16" value="البطل"></label>
      <ul class="keys desktop"><li><b>WASD / الأسهم</b> حركة</li><li><b>Shift</b> جري</li><li><b>عجلة الماوس</b> زووم</li></ul>
      <ul class="keys touch"><li><b>اسحب بصباعك</b> حركة</li><li><b>زرار جري</b> جري</li></ul>
      <button id="playBtn" class="primary" disabled>بيحمّل…</button>
    </div>
  </div>
</div>

<div id="end" class="overlay" hidden>
  <div class="panel small">
    <div class="face big" data-face></div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <p class="best" id="endBest"></p>
    <button id="againBtn" class="primary">العب تاني</button>
  </div>
</div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- textures ----------
function makeTex(w,h,draw,rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
function grain(g,w,h,n,a){
  for (let i=0;i<n;i++){ g.fillStyle = Math.random()<.5 ? `rgba(0,0,0,${Math.random()*a})` : `rgba(255,255,255,${Math.random()*a})`; const s = Math.random()*2+.5; g.fillRect(Math.random()*w, Math.random()*h, s, s); }
}

const asphaltTex = makeTex(512,512,(g,w,h)=>{
  g.fillStyle='#45474b'; g.fillRect(0,0,w,h); grain(g,w,h,26000,.22);
  for (let i=0;i<16;i++){ g.fillStyle = `rgba(${Math.random()<.5?'25,25,28':'95,95,98'},.12)`; g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h,20+Math.random()*60,10+Math.random()*40,Math.random()*3,0,7); g.fill(); }
}, [(2*HALF+14)/10, (2*HALF+14)/10]);
const grassTex = makeTex(256,256,(g,w,h)=>{
  g.fillStyle='#56733a'; g.fillRect(0,0,w,h);
  for (let i=0;i<9000;i++){ g.fillStyle=`hsla(${78+Math.random()*30},${35+Math.random()*25}%,${20+Math.random()*24}%,.6)`; g.fillRect(Math.random()*w,Math.random()*h,1,2+Math.random()*3); }
});
const paveTex = makeTex(256,256,(g,w,h)=>{
  g.fillStyle='#aaa69d'; g.fillRect(0,0,w,h); grain(g,w,h,8000,.15);
  g.strokeStyle='rgba(60,58,52,.45)'; g.lineWidth=2;
  for (let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,h); g.stroke(); g.beginPath(); g.moveTo(0,i*64); g.lineTo(w,i*64); g.stroke(); }
}, [9,9]);
const roofTex = makeTex(256,256,(g,w,h)=>{
  g.fillStyle='#5d5f61'; g.fillRect(0,0,w,h); grain(g,w,h,9000,.2);
  g.strokeStyle='rgba(0,0,0,.2)'; for (let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,i*32); g.lineTo(w,i*32); g.stroke(); }
});
const lotTex = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#55575b'; g.fillRect(0,0,w,h); grain(g,w,h,20000,.2); }, [3,3]);

const STYLES = {
  stone:{wall:'#cdbb9c',frame:'#f1e7d4',glass:['#2f3d4a','#5c7686']},
  brick:{wall:'#8e4b3a',frame:'#e9e2d6',glass:['#1f2a33','#4b5f6c']},
  concrete:{wall:'#9a9c9e',frame:'#55585b',glass:['#24313b','#6c8797']},
  cream:{wall:'#e4d9c4',frame:'#b9a98c',glass:['#34454f','#7d98a5']},
  glass:{wall:'#3d5466',frame:'#a7b6c0',glass:['#36566f','#a3c6da']},
};
const facadeTex = {};
for (const [name,S] of Object.entries(STYLES)) facadeTex[name] = makeTex(512,512,(g,w,h)=>{
  const bw=128, fh=128;
  g.fillStyle=S.wall; g.fillRect(0,0,w,h); grain(g,w,h,12000,.12);
  if (name==='brick'){ g.strokeStyle='rgba(40,20,15,.28)'; g.lineWidth=1; for(let y=0;y<h;y+=8){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); for(let x=((y/8)%2)*8;x<w;x+=16){ g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+8); g.stroke(); } } }
  for (let fy=0;fy<4;fy++) for (let bx=0;bx<4;bx++){
    const x=bx*bw, y=fy*fh;
    let wx,wy,ww,wh;
    if (name==='glass'){ wx=x+4; wy=y+6; ww=bw-8; wh=fh-12; } else { wx=x+26; wy=y+26; ww=bw-52; wh=fh-48; }
    g.fillStyle=S.frame; g.fillRect(wx-5,wy-5,ww+10,wh+10);
    const gr=g.createLinearGradient(wx,wy,wx+ww*.6,wy+wh); gr.addColorStop(0,S.glass[1]); gr.addColorStop(1,S.glass[0]);
    g.fillStyle=gr; g.fillRect(wx,wy,ww,wh);
    if (Math.random()<.35){ g.fillStyle=`rgba(${200+Math.random()*50|0},${180+Math.random()*50|0},${150+Math.random()*60|0},.85)`; const cw=ww*(.2+Math.random()*.3); g.fillRect(Math.random()<.5?wx:wx+ww-cw,wy,cw,wh); }
    if (Math.random()<.2){ g.fillStyle='rgba(230,225,215,.9)'; g.fillRect(wx,wy,ww,wh*(.3+Math.random()*.5)); }
    g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.moveTo(wx+ww*.15,wy); g.lineTo(wx+ww*.45,wy); g.lineTo(wx+ww*.1,wy+wh); g.lineTo(wx,wy+wh); g.lineTo(wx,wy+wh*.6); g.fill();
    g.fillStyle=S.frame; g.fillRect(wx+ww/2-2,wy,4,wh);
    if (name==='cream'){ g.fillStyle='#9d8e72'; g.fillRect(x+14,y+fh-24,bw-28,6); g.fillStyle='rgba(60,50,40,.55)'; for(let i=0;i<9;i++) g.fillRect(x+18+i*11,y+fh-42,2,18); }
    if (name==='stone'){ g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(x,y+fh-8,bw,3); }
  }
  if (name==='concrete'){ g.fillStyle='rgba(0,0,0,.12)'; for(let fy=0;fy<4;fy++) g.fillRect(0,fy*fh+fh-14,w,9); }
});

function addBuilding(cx, cz, w, d, h, style){
  const geo = new THREE.BoxGeometry(w, h, d);
  const uv = geo.attributes.uv, TW = 16, TH = 12.8;
  for (let i=0;i<24;i++){
    let su_=1, sv=1;
    if (i<8){ su_=d/TW; sv=h/TH; } else if (i<16){ su_=w/10; sv=d/10; } else { su_=w/TW; sv=h/TH; }
    uv.setXY(i, uv.getX(i)*su_, uv.getY(i)*sv);
  }
  const isGlass = style==='glass';
  const fm = new THREE.MeshStandardMaterial({ map: facadeTex[style], roughness: isGlass?.22:.85, metalness: isGlass?.4:0, envMapIntensity: isGlass?1.1:.35 });
  const rm = new THREE.MeshStandardMaterial({ map: roofTex, roughness: .95, envMapIntensity: .3 });
  const m = new THREE.Mesh(geo, [fm,fm,rm,rm,fm,fm]);
  m.position.set(cx, h/2 + .15, cz); m.castShadow = m.receiveShadow = true; scene.add(m);
  // roof clutter
  const n = 1 + Math.floor(rng()*3);
  for (let i=0;i<n;i++){
    const bx = new THREE.Mesh(new THREE.BoxGeometry(R(1.2,3), R(.8,1.8), R(1.2,3)), rm);
    bx.position.set(R(-w/2+2, w/2-2), h/2 + bx.geometry.parameters.height/2, R(-d/2+2, d/2-2));
    bx.castShadow = true; m.add(bx);
  }
  // ledge
  const ledge = new THREE.Mesh(new THREE.BoxGeometry(w+.3, .35, d+.3), rm); ledge.position.y = h/2; m.add(ledge);
  m.updateMatrixWorld(true);
  buildings.push({ mesh:m, mats:[fm,rm], box:new THREE.Box3().setFromObject(m), opacity:1 });
  obstacles.push({ minX:cx-w/2, maxX:cx+w/2, minZ:cz-d/2, maxZ:cz+d/2, building:true });

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' || joy.id !== null) return;
  joy.id = e.pointerId; joy.x0 = e.clientX; joy.y0 = e.clientY;
  joyEl.style.left = e.clientX+'px'; joyEl.style.top = e.clientY+'px'; joyEl.style.display = 'block'; knob.style.transform = '';
});
addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const m = Math.hypot(dx,dy), max = 55;
  if (m > max){ dx *= max/m; dy *= max/m; }
  joy.vx = dx/max; joy.vz = dy/max; joy.mag = Math.min(1, m/max);
  knob.style.transform = `translate(${dx}px,${dy}px)`;
});
const endJoy = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.vx = joy.vz = joy.mag = 0; joyEl.style.display = 'none'; };
addEventListener('pointerup', endJoy); addEventListener('pointercancel', endJoy);
let runBtn = false; const rb = $('runBtn');
rb.addEventListener('pointerdown', e => { e.stopPropagation(); runBtn = true; rb.classList.add('on'); });
const rbOff = () => { runBtn = false; rb.classList.remove('on'); };
rb.addEventListener('pointerup', rbOff); rb.addEventListener('pointerleave', rbOff); rb.addEventListener('pointercancel', rbOff);

// ---------- game state ----------
const SPAWN = new THREE.Vector3(7.5, 0, 7.5);
const player = { pos: SPAWN.clone(), vel: new THREE.Vector3(), knock: new THREE.Vector3(), hp: 3, stamina: 1, tired: false, inv: 0, phase: 0, cash: 0, money: 0, yaw: 0 };
const police = { active: false, mode: 'grid', node: [0,0], lostT: 0, flashT: 0, yaw: 0, spawnT: 0 };
let state = 'menu', runTime = 0, bannerT = 0, shake = 0;
const lookAt = new THREE.Vector3();

function banner(text, cls, dur=2.5){ const b = $('banner'); b.textContent = text; b.className = 'banner show ' + cls; bannerT = dur; }
function hideBanner(){ $('banner').className = 'banner'; bannerT = 0; }
function updateHud(){
  $('money').textContent = '$' + player.money.toLocaleString('en-US');
  $('count').textContent = `${player.cash} / ${CASH_N}`;
  $('hearts').textContent = '❤️'.repeat(player.hp) + '🖤'.repeat(Math.max(0,3-player.hp));
}
function fmtTime(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return `${m}:${String(s).padStart(2,'0')}`; }

function reset(){
  player.pos.copy(SPAWN); player.vel.set(0,0,0); player.knock.set(0,0,0);
  Object.assign(player, { hp:3, stamina:1, tired:false, inv:0, cash:0, money:0, phase:0 });
  cash.forEach(c => { c.taken = false; c.pop = 0; c.g.visible = true; c.g.scale.setScalar(1); });
  police.active = false; policeCar.visible = false; policeLight.intensity = 0;
  runTime = 0; hideBanner(); updateHud();
  dollMats.forEach(m => m.color.setRGB(.95,.95,.95));
  camera.position.set(SPAWN.x, 6, SPAWN.z + 9); lookAt.set(SPAWN.x, 1.2, SPAWN.z);
}
function startGame(){
  const nm = $('nameIn').value.trim() || 'البطل';
  store.set('sc_name', nm); $('hudName').textContent = nm;
  initAudio(); reset();
  $('menu').hidden = true; $('end').hidden = true; $('hud').hidden = false;
  state = 'play';
  banner('دوّر على الفلوس الخضرا 💵', 'info', 3);
}
function endGame(kind){
  state = 'end'; if (sirenGain) sirenGain.gain.value = 0;
  const nm = $('hudName').textContent;
  const T = { caught: ['اتمسكت! 🚔', `الشرطة لحقت ${nm} بعد ما جمع $${player.money.toLocaleString('en-US')}.`],
              hit: ['العربيات خبطتك! 🚗', `${nm} جمع $${player.money.toLocaleString('en-US')} قبل ما يقع.`],
              win: ['جمعت كل الفلوس! 💰', `${nm} جمع $${player.money.toLocaleString('en-US')} في ${fmtTime(runTime)} وهرب من الشرطة.`] }[kind];
  $('endTitle').textContent = T[0]; $('endText').textContent = T[1];
  let best = '';
  if (kind === 'win'){
    const prev = parseFloat(store.get('sc_best') || '0');
    if (!prev || runTime < prev){ store.set('sc_best', String(runTime)); best = 'رقم قياسي جديد! 🏆'; }
    else best = `أحسن وقت: ${fmtTime(prev)}`;
    tone(523,523,.15,'triangle',.2); tone(659,659,.15,'triangle',.2,.15); tone(784,1046,.4,'triangle',.22,.3);
  } else { thud(); tone(300,90,.6,'sawtooth',.15); }
  $('endBest').textContent = best;
  setTimeout(() => { $('hud').hidden = true; $('end').hidden = false; }, kind === 'win' ? 600 : 900);
}
$('playBtn').onclick = startGame;
$('againBtn').onclick = startGame;
addEventListener('keydown', e => { if (e.code === 'Enter' && state !== 'play' && !$('playBtn').disabled) startGame(); });

// ---------- physics helpers ----------
const PR = .35;
function blocked(x, z){ for (const o of obstacles) if (x > o.minX-PR && x < o.maxX+PR && z > o.minZ-PR && z < o.maxZ+PR) return true; return false; }
function groundY(x, z){ for (const b of blocksInfo) if (Math.abs(x-b.cx) < BW/2 && Math.abs(z-b.cz) < BW/2) return .15; return 0; }
function segHitsBox(ax, az, bx, bz, o, pad){
  let t0 = 0, t1 = 1; const dx = bx-ax, dz = bz-az;
  for (const [p,d,mn,mx] of [[ax,dx,o.minX-pad,o.maxX+pad],[az,dz,o.minZ-pad,o.maxZ+pad]]){
    if (Math.abs(d) < 1e-9){ if (p < mn || p > mx) return false; }
    else { let ta = (mn-p)/d, tb = (mx-p)/d; if (ta > tb) [ta,tb] = [tb,ta]; t0 = Math.max(t0,ta); t1 = Math.min(t1,tb); if (t0 > t1) return false; }
  }
  return true;
}
function lineOfSight(ax, az, bx, bz){ for (const o of obstacles) if (o.building && segHitsBox(ax,az,bx,bz,o,.3)) return false; return true; }
function carLocal(car, p){
  const h = car.rotation.y, fx = Math.sin(h), fz = Math.cos(h);
  const dx = p.x - car.position.x, dz = p.z - car.position.z;
  return { along: dx*fx + dz*fz, lat: dx*fz - dz*fx };
}
function nearestNode(x, z){ let best = [0,0], bd = 1e9; for (let i=0;i<=N;i++) for (let k=0;k<=N;k++){ const d = (ROADS[i]-x)**2 + (ROADS[k]-z)**2; if (d < bd){ bd = d; best = [i,k]; } } return best; }
function lerpAngle(a, b, t){ let d = ((b - a + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI; return a + d*t; }

function spawnPolice(){
  const p = player.pos; const opts = [];
  for (let i=0;i<=N;i++) for (let k=0;k<=N;k++){ const d = Math.hypot(ROADS[i]-p.x, ROADS[k]-p.z); if (d > 45 && d < 90) opts.push([i,k]); }
  const n = opts.length ? opts[Math.floor(Math.random()*opts.length)] : [0,0];
  policeCar.position.set(ROADS[n[0]], 0, ROADS[n[1]]);
  police.node = n; police.mode = 'grid'; police.active = true; police.lostT = 0; police.spawnT = 0;
  policeCar.visible = true; policeLight.intensity = 30;
  banner('🚨 الشرطة وراك! اجري', 'police', 3);
}

// ---------- update ----------
const _tmp = new THREE.Vector3(), ray = new THREE.Ray(), headPos = new THREE.Vector3();
function update(dt, t){
  const p = player.pos;
  if (state === 'play'){
    runTime += dt;
    // input
    let ix = 0, iz = 0;
    if (keys.KeyW || keys.ArrowUp) iz -= 1;
    if (keys.KeyS || keys.ArrowDown) iz += 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    ix += joy.vx; iz += joy.vz;
    let mag = Math.hypot(ix, iz); if (mag > 1){ ix /= mag; iz /= mag; mag = 1; }
    const wantRun = (keys.ShiftLeft || keys.ShiftRight || runBtn || joy.mag > .93) && mag > .1;
    let spd = 5;
    if (wantRun && !player.tired){ spd = 9.2; player.stamina -= dt*.2; if (player.stamina <= 0){ player.stamina = 0; player.tired = true; } }
    else { player.stamina = Math.min(1, player.stamina + dt*.15); if (player.tired && player.stamina > .35) player.tired = false; }
    _tmp.set(ix*spd, 0, iz*spd);
    player.vel.lerp(_tmp, damp(12, dt));
    player.knock.multiplyScalar(Math.exp(-dt*5));
    const mx = (player.vel.x + player.knock.x)*dt, mz = (player.vel.z + player.knock.z)*dt;
    if (!blocked(p.x+mx, p.z)) p.x += mx; else { player.vel.x = 0; player.knock.x = 0; }
    if (!blocked(p.x, p.z+mz)) p.z += mz; else { player.vel.z = 0; player.knock.z = 0; }
    p.x = clamp(p.x, -LIMIT, LIMIT); p.z = clamp(p.z, -LIMIT, LIMIT);
    p.y += (groundY(p.x, p.z) - p.y) * damp(18, dt);
    if (player.inv > 0) player.inv -= dt;

    // cash pickup
    for (const c of cash){
      if (c.taken) continue;
      if (Math.hypot(c.x - p.x, c.z - p.z) < 1.4){
        c.taken = true; c.pop = .001; player.cash++; player.money += c.value; updateHud();
        tone(880,1320,.12,'square',.08); tone(1320,1760,.16,'square',.07,.08);
        if (player.cash === CASH_N){ endGame('win'); break; }
        if (!police.active) spawnPolice();
        else banner(`+$${c.value}`, 'ok', 1.2);
      }
    }
  }

  // traffic
  for (const c of traffic){
    const u = c.userData;
    let target = u.base;
    for (const o of traffic){
      if (o === c) continue; const v = o.userData;
      if (v.axis !== u.axis || v.road !== u.road || v.dir !== u.dir) continue;
      const ahead = (v.s - u.s) * u.dir;
      if (ahead > 0 && ahead < 10) target = Math.min(target, ahead < 6 ? 0 : v.speed);
    }
    u.speed += (target - u.speed) * damp(3, dt);
    u.s += u.speed * u.dir * dt;
    if (u.s * u.dir > HALF + 25) u.s = -(HALF + 25) * u.dir;
    placeTraffic(c);
    if (state === 'play' && player.inv <= 0){
      const L = carLocal(c, p);
      if (Math.abs(L.along) < 2.45 && Math.abs(L.lat) < 1.25){
        player.hp--; player.inv = 1.8; shake = .5; updateHud(); thud();
        const fx = Math.sin(c.rotation.y), fz = Math.cos(c.rotation.y), side = L.lat >= 0 ? 1 : -1;
        player.knock.set(fz*side*9 + fx*u.speed*.5, 0, -fx*side*9 + fz*u.speed*.5);
        $('flash').style.opacity = 1; setTimeout(() => $('flash').style.opacity = 0, 180);
        if (player.hp <= 0){ endGame('hit'); } else banner('آه! خلي بالك من العربيات', 'police', 1.6);
      }
    }
  }

  // police
  if (police.active){
    police.spawnT += dt;
    const pc = policeCar.position, dx = p.x - pc.x, dz = p.z - pc.z, dist = Math.hypot(dx, dz);
    const sees = dist < 42 && lineOfSight(pc.x, pc.z, p.x, p.z);
    const speed = (state === 'play' ? 6.9 + Math.min(player.cash, 10)*.13 : 3) + (police.mode === 'grid' ? .9 : 0);
    let tx, tz;
    if (sees && state === 'play'){ police.mode = 'direct'; tx = p.x; tz = p.z; police.lostT = 0; }
    else {
      if (police.mode === 'direct'){ police.mode = 'grid'; police.node = nearestNode(pc.x, pc.z); }
      tx = ROADS[police.node[0]]; tz = ROADS[police.node[1]];
      if (Math.hypot(tx-pc.x, tz-pc.z) < .9){
        const opts = [[1,0],[-1,0],[0,1],[0,-1]].map(([a,b]) => [police.node[0]+a, police.node[1]+b]).filter(([i,k]) => i>=0 && k>=0 && i<=N && k<=N);
        opts.sort((A,B) => Math.hypot(ROADS[A[0]]-p.x, ROADS[A[1]]-p.z) - Math.hypot(ROADS[B[0]]-p.x, ROADS[B[1]]-p.z));
        police.node = opts[0]; tx = ROADS[police.node[0]]; tz = ROADS[police.node[1]];
      }
      if (dist > 48) police.lostT += dt; else police.lostT = Math.max(0, police.lostT - dt*.5);
    }
    let vx = tx - pc.x, vz = tz - pc.z; const vl = Math.hypot(vx, vz) || 1; vx = vx/vl*speed; vz = vz/vl*speed;
    const nx = pc.x + vx*dt, nz = pc.z + vz*dt;
    if (police.mode === 'direct' && obstacles.some(o => o.building && nx > o.minX-1.1 && nx < o.maxX+1.1 && nz > o.minZ-1.1 && nz < o.maxZ+1.1)){
      police.mode = 'grid'; police.node = nearestNode(pc.x, pc.z);
    } else { pc.x = nx; pc.z = nz; }
    policeCar.rotation.y = lerpAngle(policeCar.rotation.y, Math.atan2(vx, vz), damp(6, dt));
    police.flashT += dt;
    const on = Math.floor(police.flashT*7) % 2 === 0;
    policeCar.userData.red.emissiveIntensity = on ? 3 : .2; policeCar.userData.blue.emissiveIntensity = on ? .2 : 3;
    policeLight.color.setHex(on ? 0xff2040 : 0x2050ff);
    if (sirenGain) sirenGain.gain.value = state === 'play' ? clamp(.09 - dist*.0011, .015, .09) : 0;
    if (state === 'play'){
      const L = carLocal(policeCar, p);
      if (police.spawnT > 1 && Math.abs(L.along) < 2.6 && Math.abs(L.lat) < 1.35){ shake = .6; endGame('caught'); }
      else if (police.lostT > 7){
        police.active = false; policeCar.visible = false; policeLight.intensity = 0; if (sirenGain) sirenGain.gain.value = 0;
        banner('هربت منهم 😎', 'ok', 2.5);
      }
    }
  } else if (sirenGain) sirenGain.gain.value = 0;

  // cash anim
  for (const c of cash){
    if (c.taken){
      if (c.pop > 0){ c.pop += dt; c.g.position.y = c.pop*6; c.g.scale.setScalar(Math.max(0, 1 - c.pop*2.5)); if (c.pop > .4){ c.pop = 0; c.g.visible = false; c.g.position.y = 0; } }
      continue;
    }
    c.stack.rotation.y = t*1.6; c.stack.position.y = 1.0 + Math.sin(t*2.4 + c.x)*.15;
  }

  // character animation
  const sp = Math.hypot(player.vel.x, player.vel.z);
  player.phase += dt * sp * 1.6;
  const amp = Math.min(sp/5, 1.35), s = Math.sin(player.phase);
  doll.position.y = Math.abs(Math.cos(player.phase)) * .05 * amp;
  parts.legL.p.scale.y = 1 - Math.max(0, s) * .09 * amp;
  parts.legR.p.scale.y = 1 - Math.max(0, -s) * .09 * amp;
  parts.armL.p.scale.y = 1 - Math.max(0, -s) * .1 * amp; parts.armL.p.rotation.z = -Math.max(0,-s)*.06*amp;
  parts.armR.p.scale.y = 1 - Math.max(0, s) * .1 * amp; parts.armR.p.rotation.z = Math.max(0,s)*.06*amp;
  doll.rotation.z = s * .025 * amp;
  doll.scale.y = 1 + (sp < .3 ? Math.sin(t*2.2)*.006 : 0);
  player.yaw += (clamp(player.vel.x/9, -1, 1)*.42 - player.yaw) * damp(8, dt);
  doll.rotation.y = player.yaw;
  doll.visible = !(player.inv > 0 && Math.floor(player.inv*12) % 2 === 1);
  charGroup.position.copy(p);

  // camera
  camDist += (camTarget - camDist) * damp(5, dt);
  _tmp.set(p.x, p.y + 1.1 + camDist*.44, p.z + camDist);
  camera.position.lerp(_tmp, damp(6, dt));
  lookAt.lerp(_tmp.set(p.x, p.y + 1.2, p.z), damp(10, dt));
  if (shake > 0){ shake -= dt; camera.position.x += (Math.random()-.5)*shake*.6; camera.position.y += (Math.random()-.5)*shake*.6; }
  camera.lookAt(lookAt);

  // sun follows player for crisp shadows
  sun.target.position.copy(p); sun.position.copy(p).addScaledVector(sunDir, 110);

  // fade buildings between camera and hero
  headPos.set(p.x, p.y + 1.4, p.z);
  ray.origin.copy(camera.position); ray.direction.copy(headPos).sub(camera.position);
  const segLen = ray.direction.length(); ray.direction.normalize();
  for (const b of buildings){
    const hit = ray.intersectBox(b.box, _tmp);
    const blocking = hit && camera.position.distanceTo(_tmp) < segLen - .3;
    const target = blocking ? .2 : 1;
    if (Math.abs(b.opacity - target) > .005){
      b.opacity += (target - b.opacity) * damp(10, dt);
      const tr = b.opacity < .98;
      for (const m of b.mats){ m.opacity = b.opacity; if (m.transparent !== tr){ m.transparent = tr; m.depthWrite = !tr; m.needsUpdate = true; } }
      b.mesh.castShadow = true;
    }
  }

  // HUD
  if (state === 'play'){
    $('stam').style.width = (player.stamina*100).toFixed(1) + '%';
    $('stamWrap').classList.toggle('tired', player.tired);
    if (bannerT > 0){ bannerT -= dt; if (bannerT <= 0 && !(police.active && $('banner').classList.contains('police'))) hideBanner(); }
    if (police.active && bannerT <= 0) banner('🚨 الشرطة وراك!', 'police', 1.5);
    drawRadar(t);
  }
}

function drawRadar(t){
  rctx.drawImage(radarBase, 0, 0);
  for (const c of cash){ if (c.taken) continue; rctx.fillStyle = '#7dff88'; rctx.beginPath(); rctx.arc(rx(c.x), rz(c.z), 3, 0, 7); rctx.fill(); }
  if (police.active){ rctx.fillStyle = Math.floor(t*6)%2 ? '#ff3347' : '#3a6bff'; rctx.beginPath(); rctx.arc(rx(policeCar.position.x), rz(policeCar.position.z), 4, 0, 7); rctx.fill(); }
  rctx.fillStyle = '#fff'; rctx.strokeStyle = '#000'; rctx.lineWidth = 1.5;
  rctx.beginPath(); rctx.arc(rx(player.pos.x), rz(player.pos.z), 4, 0, 7); rctx.fill(); rctx.stroke();
}

// ---------- loop ----------
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
reset();
const clock = new THREE.Clock(); let elapsed = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05); elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
});
const pb = $('playBtn'); pb.disabled = false; pb.textContent = 'يلا نلعب';
window.__game = { player, police, cash, get state(){ return state; } };
</script>
</body>
